{% extends "base.html" %}{% block content %}<div class="page-head"><div><span class="eyebrow">LIVE TELEMETRY</span><h1>{{ task.name }}</h1><p><code>{{ task.device }}</code> · {{ task.test_type }}</p></div><button id="stop" class="btn btn-danger">{{ '取消排队' if task.status == 'queued' else '停止任务' }}</button></div>
<div class="row g-3"><div class="col-md-3"><div class="metric-card"><span>状态</span><strong id="status">{{ task.status }}</strong></div></div><div class="col-md-3"><div class="metric-card"><span>进度</span><strong id="progress">{{ task.progress }}%</strong></div></div><div class="col-md-3"><div class="metric-card"><span>运行时间</span><strong id="elapsed">—</strong></div></div><div class="col-md-3"><div class="metric-card"><span>目标</span><strong class="device-small">{{ task.device }}</strong></div></div></div>
<div class="panel mt-4"><div id="live-chart" class="chart"></div><p class="muted">IOPS、带宽与时延由 fio 每秒日志生成；SMART/温度每 30 秒采样并保存在结果目录。</p></div>{% endblock %}{% block scripts %}<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script><script>window.TEST_ID='{{ task.id }}';</script><script src="/static/js/live.js"></script>{% endblock %}
