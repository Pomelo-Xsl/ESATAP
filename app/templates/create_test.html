{% extends "base.html" %}{% block title %}创建测试 · TestLab{% endblock %}{% block content %}
<div class="page-head"><div><span class="eyebrow">SAFE TEST ORCHESTRATION</span><h1>创建测试任务</h1><p>所有参数由白名单生成；含写入的测试必须完成二次确认。</p></div></div>
<form id="test-form" class="panel form-panel"><div class="row g-4">
 <div class="col-lg-6"><label>任务名称</label><input name="name" class="form-control" required value="4K 随机读性能测试"><label>目标 Namespace</label><select name="device" id="device-select" class="form-select" required><option value="">正在扫描...</option></select><label>测试类型</label><select name="test_type" id="test-type" class="form-select"><option value="seq_read_128k">128K 顺序读</option><option value="seq_write_128k">128K 顺序写 ⚠</option><option value="rand_read_4k" selected>4K 随机读</option><option value="rand_write_4k">4K 随机写 ⚠</option><option value="randrw_70_30">4K 70/30 混合 ⚠</option><option value="randrw_50_50">4K 50/50 混合 ⚠</option><option value="qd_scan">QD 扫描（随机读）</option><option value="stress_rand_write">4K 随机写压力 ⚠</option><option value="stress_seq_write">顺序写压力 ⚠</option></select></div>
 <div class="col-lg-6"><div class="row g-3"><div class="col-6"><label>块大小（留空用预设）</label><input name="block_size" class="form-control" placeholder="4k"></div><div class="col-6"><label>队列深度</label><input name="queue_depth" type="number" class="form-control" value="32" min="1" max="1024"></div><div class="col-6"><label>并发任务数</label><input name="num_jobs" type="number" class="form-control" value="1" min="1" max="128"></div><div class="col-6"><label>运行时间（秒）</label><input name="runtime_seconds" type="number" class="form-control" value="60" min="1"></div><div class="col-6"><label>测试容量</label><input name="size" class="form-control" value="100%"></div><div class="col-6 d-flex align-items-end"><label class="check"><input name="precondition" type="checkbox"> 全盘顺序写预处理 ⚠</label></div></div></div>
</div><div id="danger-box" class="danger-box mt-4 d-none"><strong>数据破坏警告</strong><p>该操作会覆盖目标盘数据。确认目标不是系统盘、不含分区/文件系统且未挂载。</p><label class="check"><input id="danger-confirm" type="checkbox"> 我确认目标盘上的数据可以被永久覆盖</label><label>手工输入完整设备名</label><input id="confirm-device" class="form-control" placeholder="/dev/nvme2n1"></div>
<div id="form-message" class="mt-3"></div><button class="btn btn-accent mt-3" type="submit">创建并启动</button></form>
{% endblock %}{% block scripts %}<script src="/static/js/create.js"></script>{% endblock %}
